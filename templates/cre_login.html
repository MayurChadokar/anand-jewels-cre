<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRE Login - Anand Jewels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/responsive.css?v=1" rel="stylesheet">
</head>
<body class="bg-light cre-login">
<main class="min-vh-100 d-flex align-items-center py-4" style="background:linear-gradient(135deg,#b91c1c,#7f1d1d);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4 cre-login-column">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="text-center px-4 pt-5 pb-3">
                        <img src="/static/images/logo.png" alt="Anand Jewels" style="height:68px;max-width:220px;object-fit:contain;">
                        <h1 class="h4 mt-3 mb-1">Customer Relations</h1>
                        <p class="text-muted mb-0">Sign in to the CRE workspace</p>
                    </div>
                    <div class="card-body px-4 pb-4">
                        {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
                        <form method="post" action="/cre/login">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-danger btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Sign in</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-white-50 small mt-3">Anand Jewels · Customer Relations Workspace</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
