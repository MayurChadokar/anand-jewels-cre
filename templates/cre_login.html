<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRE Login - Anand Jewels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/responsive.css?v=2" rel="stylesheet">
    <meta name="theme-color" content="#b62836">
    <style>
        .cre-login-backdrop {
            background: linear-gradient(105deg, #b62836, #8b1e2d);
        }
        .cre-login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 224px;
            max-width: 100%;
            margin: 0 auto 1.5rem;
            padding: 18px 24px;
            border: 1px solid #c9a45f;
            border-radius: 16px;
            background: linear-gradient(105deg, #b62836, #8b1e2d);
            box-shadow: 0 8px 22px rgba(66, 19, 34, .16);
        }
        .cre-login-brand img {
            display: block;
            width: 174px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-light cre-login">
<main class="min-vh-100 d-flex align-items-center py-4 cre-login-backdrop">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4 cre-login-column">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="text-center px-4 pt-5 pb-3">
                        <div class="cre-login-brand"><img src="/static/images/logo.png" alt="Anand Jewels" width="174" height="134"></div>
                        <h1 class="h4 mt-3 mb-1">Customer Relations</h1>
                        <p class="text-muted mb-0">Sign in to the CRE workspace</p>
                    </div>
                    <div class="card-body px-4 pb-4">
                        {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
                        <form method="post" action="/cre/login">
                            <div class="mb-3">
                                <label class="form-label" for="username">Username</label>
                                <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" required autofocus>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input class="form-control form-control-lg" type="password" id="password" name="password" autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-danger btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right me-2"></i>Sign in</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-white-50 small mt-3">Anand Jewels · Customer Relations Workspace</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
